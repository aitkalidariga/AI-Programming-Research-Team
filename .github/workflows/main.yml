
name: Research Benchmark and Task 3 Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  docker-test:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ai-programming-research .

      - name: Run Task 2 benchmark
        run: docker run --rm ai-programming-research

  task3-test:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Task 3 dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-task3.txt
          pip install jupyter nbconvert

      - name: Process Task 3 data
        run: python -m src.process_data

      - name: Generate Task 3 figures
        run: python -m src.visualize

      - name: Execute Jupyter Notebook
        run: |
          jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=180 \
            --output /tmp/task3_verified.ipynb \
            notebooks/01_data_analysis.ipynb

      - name: Verify figure exports
        run: |
          test -s reports/figures/fig1_latency_vs_load.png
          test -s reports/figures/fig1_latency_vs_load.pdf
          test -s reports/figures/fig2_distribution_boxplot.png
          test -s reports/figures/fig2_distribution_boxplot.pdf
