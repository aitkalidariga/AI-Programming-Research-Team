name: Docker Benchmark Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  docker-test:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ai-programming-research .

      - name: Run benchmark
        run: docker run --rm ai-programming-research
